# Render Blueprint for OceanSight-V
# This file defines the services to be deployed on Render.

services:
  # Backend API Service (FastAPI)
  - type: web
    name: oceansight-backend
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
    healthCheckPath: /
    root: .

  # Frontend Service (Static Site via Nginx)
  - type: web
    name: oceansight-frontend
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    startCommand: |
      cd frontend
      npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: oceansight-backend
          property: hostname
    root: .
    dependsOn:
      - oceansight-backend